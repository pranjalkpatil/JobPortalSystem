<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Users</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">

  <h2>All Users</h2>

  <table class="job-table">

    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Action</th>
    </tr>

    <tr th:each="u : ${users}">
      <td th:text="${u.name}"></td>
      <td th:text="${u.email}"></td>
      <td th:text="${u.role}"></td>
      <td>
        <a th:href="@{'/admin/delete-user/' + ${u.id}}"
           class="btn-save">
          Delete
        </a>
      </td>
    </tr>

  </table>

</div>

</body>
</html>
