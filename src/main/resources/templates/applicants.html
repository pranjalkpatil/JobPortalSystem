<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Applicants</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="navbar">

  <h2>JobPortal</h2>

  <div class="nav-right">

    <div class="profile-section">

      <img th:if="${user.profilePic != null}"
           th:src="@{'/profile-pics/' + ${user.profilePic}}"
           class="profile-img">

      <img th:if="${user.profilePic == null}"
           src="/images/defaultUser.png"
           class="profile-img">

      <span class="profile-name"
            th:text="${user.name}">
            </span>

    </div>

    <a href="/jobs">Jobs</a>

    <a th:if="${user.role == 'USER'}"
       href="/applied-jobs">
      Applied
    </a>

    <a th:if="${user.role == 'USER'}"
       href="/saved-jobs">
      Saved
    </a>

    <a th:if="${user.role == 'RECRUITER'}"
       href="/recruiter/jobs">
      My Jobs
    </a>

    <a th:if="${user.role == 'RECRUITER'}"
       href="/add-job">
      Post Job
    </a>

    <a href="/profile">Profile</a>

    <a href="/logout">Logout</a>

  </div>

</div>

<div class="container">

  <h2>Applicants List</h2>

  <table class="job-table">

    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Status</th>
      <th>Resume</th>
      <th>Actions</th>
    </tr>

    <tr th:each="app : ${applications}">

      <td th:text="${app.user.name}"></td>

      <td th:text="${app.user.email}"></td>

      <td>

                <span th:if="${app.status == 'UNDER REVIEW'}"
                      class="status-review">
                    UNDER REVIEW
                </span>

        <span th:if="${app.status == 'ACCEPTED'}"
              class="status-accepted">
                    ACCEPTED
                </span>

        <span th:if="${app.status == 'REJECTED'}"
              class="status-rejected">
                    REJECTED
                </span>

      </td>

      <td>

        <a th:href="@{'/download-resume/' + ${app.id}}"
           class="btn">
          Download
        </a>

      </td>

      <td>

        <a th:href="@{'/application-status/' + ${app.id} + '/ACCEPTED'}"
           class="btn-apply">
          Accept
        </a>

        <a th:href="@{'/application-status/' + ${app.id} + '/REJECTED'}"
           class="btn-save">
          Reject
        </a>

        <br><br>

        <a th:href="@{'/application-status/' + ${app.id} + '/UNDER REVIEW'}"
           class="btn">
          Review
        </a>

      </td>

    </tr>

  </table>

  <br>

  <a href="/recruiter/jobs" class="btn">
    ⬅ Back
  </a>

</div>

</body>
</html>
