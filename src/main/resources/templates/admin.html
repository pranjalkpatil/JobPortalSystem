<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="navbar">

    <h2>JobPortal</h2>

    <div class="nav-right">

        <div class="profile-section">

            <img src="/images/defaultUser.png"
                 class="profile-img">

            <span class="profile-name"
                  th:text="${user.name}">
            </span>

        </div>

        <a href="/jobs">Jobs</a>

        <a th:if="${user.role == 'USER'}"
           href="/applied-jobs">
            Applied
        </a>

        <a th:if="${user.role == 'USER'}"
           href="/saved-jobs">
            Saved
        </a>

        <a th:if="${user.role == 'RECRUITER'}"
           href="/recruiter/jobs">
            My Jobs
        </a>

        <a th:if="${user.role == 'RECRUITER'}"
           href="/add-job">
            Post Job
        </a>

        <a href="/profile">Profile</a>

        <a href="/logout">Logout</a>

    </div>

</div>

<div class="container">

    <h2>👥 All Users</h2>

    <table class="job-table">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
        </tr>

        <tr th:each="u : ${users}">
            <td th:text="${u.name}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.role}"></td>
            <td>
                <a th:href="@{'/delete-user/' + ${u.id}}" class="btn">Delete</a>
            </td>
        </tr>
    </table>

    <br><br>

    <h2>💼 All Jobs</h2>

    <table class="job-table">
        <tr>
            <th>Title</th>
            <th>Company</th>
            <th>Action</th>
        </tr>

        <tr th:each="j : ${jobs}">
            <td th:text="${j.title}"></td>
            <td th:text="${j.company}"></td>
            <td>
                <a th:href="@{'/delete-job/' + ${j.id}}" class="btn">Delete</a>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
